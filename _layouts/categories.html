---
layout: default
---
<div class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <article class="post-content">

      <section>
        <h2>Categories</h2>
        <ul>
          {% for tag in site.tags %}
            <li><a href="#{{ tag[0] | escape_once }}">{{ tag[0] }}</a></li>
          {% endfor %}
        </ul>
      </section>


    {% for tag in site.tags %}
    <section class="tag-section">
      <h3 id="{{ tag[0] | escape_once }}">{{ tag[0] }}</h3>
<div class="d-grid-gallery">
        {% for post in tag[1] %}
            <div >
              <div class="preview-panel">
                <a href="{{ post.url | prepend: site.baseurl }}">
                  <img alt="post preview" src="{{ post.preview }}">

                  <div class="post-title">{{ post.title }}</div>
                </a>
              </div>
            </div>
          {% endfor %}
</div>
    </section>

    {% endfor %}

  </article>

</div>
